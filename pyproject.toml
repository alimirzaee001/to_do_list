[tool.poetry]
name = "todo-list-oop"
version = "0.1.0"
description = "A ToDo List application using Python OOP with in-memory storage"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
packages = [{include = "todo_list"}]

[tool.poetry.dependencies]
python = ">=3.8.1,<4.0"
python-dotenv = "^1.0.0"
sqlalchemy = "^2.0.25"
psycopg2-binary = "^2.9.9"
alembic = "^1.13.2"
schedule = "^1.2.1"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0.0"
black = "^23.0.0"
flake8 = "^6.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
todo-cli = "todo_list.cli:main"
todo-close-overdue = "todo_list.scheduler:main"
todo-scheduler = "todo_list.scheduler:run_scheduler"
