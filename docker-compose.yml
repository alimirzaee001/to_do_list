version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: todo_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-todo_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-todo_pass}
      POSTGRES_DB: ${DB_NAME:-todo_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - todo_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-todo_user} -d ${DB_NAME:-todo_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  todo_db_data:
